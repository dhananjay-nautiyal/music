name: Check

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository — it builds and tests and uploads
# reports — so the token is pinned to read rather than left to the
# repository default.
permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop · Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: The analyser is in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Music/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libmusic_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

      # Gradle's console names the artifacts that failed verification but never says
      # why (checksum mismatch vs none recorded); only this HTML report does, and it
      # only exists when a build failed.
      - name: Upload dependency verification report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: CMake version
        run: cmake --version

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test

      - name: Build the distributable
        run: .\gradlew.bat :desktopApp:createDistributable

      - name: The analyser is in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Music/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/music_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/music_smtc.dll'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

      # See the Linux leg: the console never says why an artifact failed verification.
      - name: Upload dependency verification report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

  desktop-macos:
    name: Desktop · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Music.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

      # See the Linux leg: the console never says why an artifact failed verification.
      - name: Upload dependency verification report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testDevDebugUnitTest

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: music-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

      # See the Linux leg: the console never says why an artifact failed verification.
      - name: Upload dependency verification report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

  lint:
    name: Lint · Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # No local.properties here on purpose: lint reads the version catalog and the
      # sources, not the Last.fm credentials, so this job also runs on fork PRs where
      # secrets are unavailable.
      - name: Lint
        run: ./gradlew :app:lintProdRelease :shared:lint

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-prodRelease.*
            shared/build/reports/lint-results-debug.*

      # See the Linux leg: the console never says why an artifact failed verification.
      - name: Upload dependency verification report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-dependency-verification-report
          path: build/reports/dependency-verification/
          if-no-files-found: ignore

  detekt:
    name: Detekt · code-size guardrails
    runs-on: ubuntu-latest
    # Runs as a plain CLI jar, not the Gradle plugin, on purpose: the plugin
    # would add a buildscript dependency to every module and force a
    # regeneration of the lock files and verification-metadata.xml that #21
    # pinned. The jar checksum below is what keeps the toolchain reproducible.
    steps:
      - uses: actions/checkout@v4

      - name: Download detekt-cli
        run: |
          curl -sSL -o detekt-cli.zip \
            https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8.zip
          echo "ff9f9258879ff2ec4349114740221498afec46a85cf6302c9f80b06eb4429501  detekt-cli.zip" | sha256sum -c
          unzip -q detekt-cli.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Detekt
        run: |
          ./detekt-cli-1.23.8/bin/detekt-cli \
            --input app/src/main/java,shared/src,sharedUi/src,desktopApp/src \
            --config config/detekt.yml \
            --baseline config/detekt-baseline.xml \
            --report txt:detekt-report.txt

      # Existing violations are baselined, so a failure here means NEW
      # oversized/complex code; the report says exactly where.
      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: detekt-report.txt
          if-no-files-found: ignore

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
