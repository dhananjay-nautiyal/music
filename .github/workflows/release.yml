name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux · AppImage, deb, rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils file
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pmusic.version=${{ steps.version.outputs.value }}

      - name: Build deb, rpm and the app image
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            -Pmusic.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Music/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libmusic_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Build the AppImage
        run: |
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/Music \
            dist/Music-${{ steps.version.outputs.value }}-linux-x86_64.AppImage \
            "$PWD/appimagetool.AppImage"

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/Music-$v-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/Music-$v-linux-x86_64.rpm"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/*

  windows:
    name: Windows · installer, msi, portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: CMake version
        run: cmake --version

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopApp:test "-Pmusic.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pmusic.version=${{ steps.version.outputs.value }}"

      - name: The analyser and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Music/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/music_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/music_smtc.dll'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/Music-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/Music-$v-windows-x64-setup.exe"
          7z a -tzip -mx=5 "dist/Music-$v-windows-x64-portable.zip" `
            "desktopApp/build/compose/binaries/main/app/Music/*" | Out-Null
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  macos:
    name: macOS · dmg, pkg, zip (${{ matrix.arch }})
    # The Intel leg is known to fail (README: the beat model does not load
    # under ONNX Runtime on the x64 runner, so packaging never runs there). It
    # stays in the matrix so that the day it starts working it simply does —
    # but it must not hold the Apple Silicon build, or the release, hostage.
    # `continue-on-error` lets a failure there through without failing the
    # job for `needs`, and `fail-fast: false` stops it cancelling arm64
    # mid-build.
    continue-on-error: ${{ matrix.arch == 'x64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopApp:test -Pmusic.version=${{ steps.version.outputs.value }}

      - name: Build DMG, PKG and the app bundle
        run: |
          ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg :desktopApp:createDistributable \
            -Pmusic.version=${{ steps.version.outputs.value }}

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/Music.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Collect
        run: |
          v="${{ steps.version.outputs.value }}"
          arch="${{ matrix.arch }}"
          mkdir -p dist
          for f in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/Music-$v-macos-$arch.dmg"
          done
          for f in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            [ -f "$f" ] && cp "$f" "dist/Music-$v-macos-$arch.pkg"
          done
          ditto -c -k --keepParent desktopApp/build/compose/binaries/main/app/Music.app "dist/Music-$v-macos-$arch.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist/*

  android:
    name: Android · signed prod release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties and the keystore
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > music-release.jks
          {
            echo "storeFile=music-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testDevDebugUnitTest

      - name: Build signed prod release APKs
        run: ./gradlew assembleProdRelease

      - name: Collect
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          # AGP's own names on the way in (`app-prod-<abi>-release.apk`),
          # the updater's convention on the way out — the same `Music-<v>`
          # prefix the desktop assets use, so a release reads as one set
          # and `AppUpdateChecker` picks by the `_<abi>` suffix (#12).
          for f in app/build/outputs/apk/prod/release/*.apk; do
            name=$(basename "$f")
            case "$name" in
              *universal*)   cp "$f" "dist/Music-${v}.apk" ;;
              *arm64-v8a*)   cp "$f" "dist/Music-${v}_arm64-v8a.apk" ;;
              *armeabi-v7a*) cp "$f" "dist/Music-${v}_armeabi-v7a.apk" ;;
              *x86_64*)      cp "$f" "dist/Music-${v}_x86_64.apk" ;;
              *x86*)         cp "$f" "dist/Music-${v}_x86.apk" ;;
              *)             cp "$f" "dist/$name" ;;
            esac
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*

  release:
    name: Publish
    # macOS is back in the gate, so a release cannot ship without its .dmg,
    # .pkg or .zip (the publish job used to start while the macOS runners were
    # still packaging, which is why v1.1.2 had to be patched by hand). The
    # Intel leg cannot block a release: it is `continue-on-error` in the
    # macos job, so a failed x64 build does not fail this job's `needs` and
    # does not cancel the arm64 leg that does produce assets.
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          merge-multiple: true
          path: dist

      - run: ls -lh dist

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      # Publishing silently ships whatever happened to be in dist/, so a job
      # that uploaded nothing — a wrong path, an empty glob — would cut a
      # release with a platform missing and nobody would find out until a
      # user went looking. Assert the assets every platform owes us. macOS
      # x64 is deliberately absent: that leg is continue-on-error in the
      # macos job, so it is allowed to contribute nothing.
      - name: Every platform's asset is here
        run: |
          v="${{ steps.version.outputs.value }}"
          missing=0
          for f in \
            "Music-$v-linux-x86_64.AppImage" \
            "Music-$v-linux-amd64.deb" \
            "Music-$v-linux-x86_64.rpm" \
            "Music-$v-windows-x64.msi" \
            "Music-$v-windows-x64-setup.exe" \
            "Music-$v-windows-x64-portable.zip" \
            "Music-$v-macos-arm64.dmg" \
            "Music-$v-macos-arm64.pkg" \
            "Music-$v-macos-arm64.zip" \
            "Music-$v.apk" \
            "Music-${v}_arm64-v8a.apk" \
            "Music-${v}_armeabi-v7a.apk" \
            "Music-${v}_x86_64.apk"
          do
            if [ ! -f "dist/$f" ]; then
              echo "::error::missing release asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "dist contains:"
            ls -lh dist
            exit 1
          fi
          echo "all expected assets present"

      - name: Draft the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Music ${{ github.ref_name }}
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
