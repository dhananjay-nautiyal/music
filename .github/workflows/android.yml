name: Android Release APK

on:
  # The release pipeline builds and publishes signed APKs itself (release.yml),
  # so this no longer runs on every push to main: that only exercised the
  # release keystore and left a signed production artifact sitting in the
  # workflow run for anyone with read access to download. Kept as a manual
  # button for a signed smoke build off any ref.
  workflow_dispatch:

# Build and upload only; nothing here pushes or releases.
permissions:
  contents: read

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > music-release.jks
        {
          echo "storeFile=music-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
