name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the PR-commenting option is switched off below precisely so this
# never needs `pull-requests: write`.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans history, so it needs the whole of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks matches secret-shaped *patterns*, so it walks past a committed
      # .jks (a binary) entirely, and can miss a local.properties full of
      # placeholder values. Those three are the files the issue names, so they
      # get a direct check instead of being left to a regex.
      - name: Check that gitignored signing and config files were not committed
        run: |
          forbidden='(^|/)local\.properties$|(^|/)keystore\.properties$|\.jks$'
          tracked=$(git ls-files | grep -E "$forbidden" || true)
          if [ -n "$tracked" ]; then
            echo "::error::These paths are .gitignore'd but are tracked in git. Untrack them and rotate anything they contain:"
            printf '  %s\n' $tracked
            exit 1
          fi
          echo "No gitignored signing or config files are tracked."

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Off because commenting needs `pull-requests: write`, and this job is
          # deliberately `contents: read`. The job summary and the failing check
          # carry the result instead.
          GITLEAKS_ENABLE_COMMENTS: 'false'
